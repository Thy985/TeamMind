# Atomcode CLI Adapter
cli_id: atomcode
command: "atomcode"
args:
  - "-p"
  - "<prompt>"
output_format: "text"
timeout_minutes: 45
working_dir: "."
health_check:
  command: "atomcode --version"
  expected_exit: 0
dependencies:
  - type: EXECUTABLE
    name: atomcode-cli
    check_command: "atomcode --version"