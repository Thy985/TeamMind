server:
  port: 8080

spring:
  application:
    name: teammind-backend
  
  datasource:
    url: jdbc:sqlite:${user.home}/.teammind/teammind.db?busy_timeout=30000&journal_mode=WAL&synchronous=FULL&foreign_keys=ON&locking_mode=NORMAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: teammind-hikari
      auto-commit: false
  
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# TeamMind 配置
teammind:
  # 数据存储路径
  data-path: ${user.home}/.teammind
  # Agent 配置目录
  agents-path: ${teammind.data-path}/agents
  # Template 配置目录
  templates-path: ${teammind.data-path}/templates
  # 进化历史目录
  evolution-path: ${teammind.data-path}/evolution
  
  # LLM 配置
  llm:
    # 默认提供商: qianfan, openai, azure, anthropic, local
    default-provider: qianfan
    # 默认模型
    default-model: deepseek-v3.2
    # 请求超时（毫秒）
    timeout: 120000
    # 最大重试次数
    max-retries: 3
    
    # 百度千帆配置（优先使用）
    qianfan:
      api-key: ${QIANFAN_API_KEY:}
      # Coding Plan OpenAI 协议兼容接口
      base-url: ${QIANFAN_BASE_URL:https://qianfan.baidubce.com/v2/coding}
      default-model: deepseek-v3.2
      models:
        - deepseek-v3.2
        - kimi-k2.5
        - glm-5
        - minimax-m2.5
        - qianfan-code-latest
    
    # OpenAI 配置（备用）
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      organization: ${OPENAI_ORG:}
      models:
        - gpt-4-turbo-preview
        - gpt-4
        - gpt-3.5-turbo
    
    # Anthropic Claude 配置（备用）
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
      default-model: claude-3-sonnet-20240229
      models:
        - claude-3-opus-20240229
        - claude-3-sonnet-20240229
        - claude-3-haiku-20240307
    
    # Azure OpenAI 配置（可选）
    azure:
      enabled: false
      api-key: ${AZURE_OPENAI_KEY:}
      endpoint: ${AZURE_OPENAI_ENDPOINT:}
      deployment-name: ${AZURE_OPENAI_DEPLOYMENT:}
    
    # 本地模型配置（可选）
    local:
      enabled: false
      base-url: ${LOCAL_LLM_URL:http://localhost:11434}
      model: ${LOCAL_LLM_MODEL:llama2}
  
  # 进化配置
  evolution:
    enabled: true
    auto-save: true
    max-history-versions: 50
    
    # Prompt 优化配置
    prompt-optimization:
      enabled: true
      min-feedback-count: 5
      auto-trigger-threshold: 0.7
    
    # 工具生成配置
    tool-generation:
      enabled: true
      require-approval: true
      default-language: Python
    
    # 拓扑进化配置
    topology-evolution:
      enabled: true
      evaluation-interval: 3600000
      min-missions-before-evolution: 10

# CORS 配置
cors:
  allowed-origins: http://localhost:3000,http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# 日志配置
logging:
  level:
    root: INFO
    com.teammind: DEBUG
    org.hibernate.SQL: DEBUG
    com.teammind.llm: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
