[tools]
node = "22"

[tasks.info]
description = "Report the project runtime without changing files"
run = "node -e \"const cp=require('child_process');const npm=process.platform==='win32'?'npm.cmd':'npm';console.log(JSON.stringify({cwd: process.cwd(), node: process.version, npm: cp.execFileSync(npm, ['--version'], {encoding: 'utf8'}).trim()}, null, 2))\""
