# TeamMind CI 流水线配置
# 前端：Vue3 + TypeScript + Vite + Vitest + ESLint（Node 22）
# 后端：Spring Boot 3.2 + Java 17 + Maven

# === 公共配置（YAML 锚点，供复用） ===

# 前端构建环境
.frontend-env: &frontend-env
  runner:
    cpus: 4
  docker:
    image: node:22
    volumes:
      - frontend_node_modules

# 后端构建环境
.backend-env: &backend-env
  runner:
    cpus: 8
  docker:
    image: maven:3.9-eclipse-temurin-17
    volumes:
      - backend_m2_repo
  env:
    # JWT 密钥（>=32字符），供后端启动/测试使用；生产须自行注入
    TEAMMIND_JWT_SECRET: ${TEAMMIND_JWT_SECRET:-teammind-ci-build-only-secret-0123456789abcdef}

# 前端依赖安装
.frontend-install: &frontend-install
  name: install
  script: npm ci --frozen-lockfile

# 后端依赖编译（pom.xml 位于 backend/ 子目录，需先进入）
.backend-install: &backend-install
  name: compile
  script: cd backend && mvn -B -q compile

# 前端质量门禁（install 之后统一执行 lint + 测试 + 构建）
# 注意：CI 使用 lint:ci（不含 --fix），避免在构建机改动源码
.frontend-stages: &frontend-stages
  - *frontend-install
  - name: lint
    script: npm run lint:ci
  - name: test
    script: npm run test:coverage
  - name: build
    script: npm run build

# 后端质量门禁
# mvn package 会执行完整生命周期（compile + test + package），避免重复执行
.backend-stages: &backend-stages
  - *backend-install
  - name: package
    script: cd backend && mvn -B package

# === 触发规则 ===

# main 分支 push：完整构建与测试
main:
  push:
    - name: frontend-ci
      <<: *frontend-env
      stages: *frontend-stages
    - name: backend-ci
      <<: *backend-env
      stages: *backend-stages

# 任意分支 PR：做基础质量检查（lint + 测试 + 构建）
"feature/*":
  pull_request:
    - name: frontend-check
      <<: *frontend-env
      stages: *frontend-stages
    - name: backend-check
      <<: *backend-env
      stages: *backend-stages

# 兜底分支（其他任意分支 push 也跑基础检查）
$:
  push:
    - name: frontend-check
      <<: *frontend-env
      stages: *frontend-stages
    - name: backend-check
      <<: *backend-env
      stages: *backend-stages
