[package]
name = "teammind-app"
version = "0.1.0"
description = "TeamMind — Local Agent Runtime + Mission Control"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
# M4: add tray feature when system tray is implemented
# windows: ["system-tray"]

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (proxy to Spring Boot)
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"

[dev-dependencies]
